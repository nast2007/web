<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход - Food Construct</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
    <header>
        <div class="container">
            <div class="header-content">
                <h1><a href="index.html" class="logo-link">Food Construct</a></h1>
                <nav>
                    <ul>
                        <li><a href="index.html#about">О нас</a></li>
                        <li><a href="lunch.html">Собрать ланч</a></li>
                        <li><a href="auth.html">Войти</a></li>
                        <li><a href="feedback.html">Обратная связь</a></li>
                        <li><a href="checkout.html">Оформить заказ</a></li>
                        <li><a href="orders.html">Мои заказы</a></li>
                        <li><a href="index.html#contacts">Контакты</a></li>
                    </ul>
                </nav>
            </div>
        </div>
    </header>
    
    <main>
        <div class="auth-container">
            <div class="auth-form">
                <h2>Вход в аккаунт</h2>
                <form action="https://httpbin.org/post" method="POST">
                    <div class="form-group">
                        <label for="login">Логин:</label>
                        <input type="text" id="login" name="login" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="password">Пароль:</label>
                        <input type="password" id="password" name="password" required>
                    </div>
                    
                    <div class="form-group checkbox-group">
                        <input type="checkbox" id="remember" name="remember">
                        <label for="remember">Запомнить меня</label>
                    </div>
                    
                    <button type="submit" class="btn-primary">Войти</button>
                </form>
                
                <div class="auth-links">
                    <a href="#">Забыли пароль?</a>
                    <a href="#">Регистрация</a>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
